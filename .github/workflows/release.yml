# Compila Fulgur para Windows y publica el .exe en GitHub Releases.
#
# Dos modos automáticos:
#   - Cada push a master  -> actualiza la release "latest" (siempre el último .exe).
#     Enlace de descarga fijo:
#     https://github.com/AndresDeC/Fulgur-project/releases/download/latest/fulgur-latest-windows-x64.exe
#   - Cada etiqueta vX.Y.Z -> crea una release versionada aparte.
#
# El binario es autónomo: se descarga y se ejecuta, sin instalación.
name: Release

on:
  push:
    branches: [master]
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar toolchain de Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache de cargo
        uses: Swatinem/rust-cache@v2

      - name: Compilar en release
        run: cargo build --release

      # Decide el nombre y tipo de release según el disparador (tag vs push a master).
      - name: Preparar la release
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like "refs/tags/*") {
            "TAG=$env:GITHUB_REF_NAME"              | Out-File -FilePath $env:GITHUB_ENV -Append
            "RELNAME=Fulgur $env:GITHUB_REF_NAME"   | Out-File -FilePath $env:GITHUB_ENV -Append
            "PRERELEASE=false"                       | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            "TAG=latest"                             | Out-File -FilePath $env:GITHUB_ENV -Append
            "RELNAME=Última versión (master)"        | Out-File -FilePath $env:GITHUB_ENV -Append
            "PRERELEASE=true"                        | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      - name: Renombrar el binario
        shell: pwsh
        run: Copy-Item target/release/fulgur.exe "fulgur-$env:TAG-windows-x64.exe"

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.RELNAME }}
          prerelease: ${{ env.PRERELEASE }}
          target_commitish: ${{ github.sha }}
          files: fulgur-${{ env.TAG }}-windows-x64.exe
          body: |
            Fulgur ⚡ — IDE nativo y ultraligero en Rust.

            **Descarga:** `fulgur-${{ env.TAG }}-windows-x64.exe` (abajo). Es autónomo:
            descárgalo y ejecútalo, sin instalación.

            Esta descarga se regenera automáticamente en cada cambio del proyecto.
