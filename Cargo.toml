[package]
name = "fulgur"
version = "0.2.0"
edition = "2024"

[dependencies]
eframe = "0.34.3"
egui_extras = { version = "0.34.3", features = ["syntect"] }
rfd = "0.15"          # diálogos nativos de abrir/guardar archivo y carpeta
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] } # HTTP para el mercado y las IAs
sha2 = "0.10"         # verificación de integridad de extensiones
dirs = "5"            # carpeta de configuración del usuario (~/.fulgur)
arboard = "3"         # leer el portapapeles (menú Edición → Pegar)

# El binario final ligero: optimiza y quita símbolos en release.
[profile.release]
opt-level = 3
lto = true
strip = true
