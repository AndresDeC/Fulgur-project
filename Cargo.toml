[package]
name = "fulgur"
version = "0.2.0"
edition = "2024"

[dependencies]
# Backend glow (OpenGL): bastante más ligero en RAM que el wgpu por defecto,
# que es lo único que necesita una UI 2D como la de Fulgur.
eframe = { version = "0.34.3", default-features = false, features = [
    "glow",
    "default_fonts",
    "accesskit",
] }
egui_extras = { version = "0.34.3", features = ["syntect"] }
rfd = "0.15"          # diálogos nativos de abrir/guardar archivo y carpeta
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] } # HTTP para el mercado y las IAs
sha2 = "0.10"         # verificación de integridad de extensiones
dirs = "5"            # carpeta de configuración del usuario (~/.fulgur)
arboard = "3"         # leer el portapapeles (menú Edición → Pegar)

# Detección de errores de sintaxis: parser real, incremental y muy ligero
# (pocos MB), no un modelo de IA. Cada gramática es un paquete aparte.
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-json = "0.24"

# El binario final ligero: optimiza y quita símbolos en release.
[profile.release]
opt-level = 3
lto = true
strip = true
